# Inspired by https://github.com/NotCookey/Pyinstaller-Github-Actions

name: Build and release

on:
  push:
    tags:
      - 'v*.*.*'

env:
  APP_NAME: 'BoreMapper'
  APP_DIR: 'boremapper'

jobs:
  
  prebuild:
    if: github.event.base_ref == 'refs/heads/main'
    runs-on: 'ubuntu-latest'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup python
        uses: actions/setup-python@v6
        with:
          python-version: 3.14.x
          cache: 'pip'
          cache-dependency-path: |
            **/requirements*.txt

      - name: Init environment
        run: |
          make init
          make init-dev

      - name: Run unit tests
        run: |
          make test-unit
  
  build-windows:
    needs:
      - prebuild
    runs-on: ${{ matrix.variant.os }}
    strategy:
      fail-fast: false
      matrix:
        variant: [
          { arch: 'x64', os: 'windows-2025' },
          { arch: 'arm64', os: 'windows-11-arm' },
        ]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # Needed for extract-version-from-tag-action
          
      - name: Extract version from tag
        uses: damienaicheh/extract-version-from-tag-action@v1.3.0

      - name: Setup env variables
        run: |
          Add-Content -Path $env:GITHUB_ENV -Value "ARCH=${{ matrix.variant.arch }}"
          Add-Content -Path $env:GITHUB_ENV -Value "VERSION=${env:MAJOR}.${env:MINOR}.${env:PATCH}"
      
      - name: Write version file
        run: |
          echo "VERSION = '${env:VERSION}'" > "${env:APP_DIR}/version.py"
          echo "Version file contents:"
          cat "${env:APP_DIR}/version.py"

      - name: Setup python
        uses: actions/setup-python@v6
        with:
          python-version: 3.14.x
          cache: 'pip'
          cache-dependency-path: |
            **/requirements*.txt

      - name: Init environment
        run: |
          make init
          make init-dev

      - name: Build app
        run: |
          make build-windows

      - name: Create artifact
        uses: actions/upload-artifact@v6
        with:
          name: 'windows-${{ env.ARCH }}-dist'
          path: dist/

      - name: Show dist files
        run: |
          ls -R dist/

  build-linux:
    needs:
      - prebuild
    runs-on: ${{ matrix.variant.os }}
    strategy:
      fail-fast: false
      matrix:
        variant: [
          { arch: 'x64', os: 'ubuntu-24.04' },
          { arch: 'arm64', os: 'ubuntu-24.04-arm' },
        ]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # Needed for extract-version-from-tag-action
          
      - name: Extract version from tag
        uses: damienaicheh/extract-version-from-tag-action@v1.3.0

      - name: Setup env variables
        run: |
          echo "ARCH=${{ matrix.variant.arch }}" >> $GITHUB_ENV
          echo "VERSION=$MAJOR.$MINOR.$PATCH" >> $GITHUB_ENV
      
      - name: Write version file
        run: |
          echo "VERSION = '$VERSION'" > "${APP_DIR}/version.py"
          echo "Version file contents:"
          cat "${APP_DIR}/version.py"

      - name: Setup python
        uses: actions/setup-python@v6
        with:
          python-version: 3.14.x
          cache: 'pip'
          cache-dependency-path: |
            **/requirements*.txt

      - name: Init environment
        run: |
          make init
          make init-dev

      - name: Build app
        run: |
          make build-linux

      - name: Create artifact
        uses: actions/upload-artifact@v6
        with:
          name: 'linux-${{ env.ARCH }}-dist'
          path: dist/

      - name: Show dist files
        run: |
          ls -R dist/

  release:
    needs:
      - build-windows
      - build-linux
    runs-on: ubuntu-latest
    if: startswith(github.ref, 'refs/tags/v')
    
    steps:
      - uses: actions/checkout@v6

      - name: Extract version from tag
        uses: damienaicheh/extract-version-from-tag-action@v1.3.0

      - name: Process version
        run: |
          echo "VERSION=$MAJOR.$MINOR.$PATCH" >> $GITHUB_ENV

      - name: Download and extract artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Install command-line tools
        run: |
          sudo apt-get update
          sudo apt-get install -y zip tar gzip
      
      - name: Create release archives
        run: |
          ls -R
          mkdir release
          (cd artifacts/windows-x64-dist/ && zip -r ../../release/$APP_NAME-$VERSION-windows-x64.zip .)
          (cd artifacts/windows-arm64-dist/ && zip -r ../../release/$APP_NAME-$VERSION-windows-arm64.zip .)
          (cd artifacts/linux-x64-dist/ && tar -cvzf ../../release/$APP_NAME-$VERSION-linux-x64.tar.gz .)
          (cd artifacts/linux-arm64-dist/ && tar -cvzf ../../release/$APP_NAME-$VERSION-linux-arm64.tar.gz .)
    
      - name: Add files to GitHub release
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.RELEASE_TOKEN }}
          files: |
            release/*

      - name: Create GitHub release
        uses: Roang-zero1/github-create-release-action@v3
        with:
          update_existing: true
          version_regex: ^v[[:digit:]]+\.[[:digit:]]+\.[[:digit:]]+
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}